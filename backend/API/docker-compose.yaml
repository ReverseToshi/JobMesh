version: '3.8'

services:
  jobmesh-api:
    build:
      context: ./backend/API/JobMesh.Api
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    depends_on:
      - jobmesh-db
      - jobmesh-redis
  jobmesh-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myappdb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
  jobmesh-redis:
    image: redis:latest
    ports:
      - "6379:6379"
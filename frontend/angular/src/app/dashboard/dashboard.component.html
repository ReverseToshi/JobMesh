<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Dashboard</h1>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </header>

  <main class="dashboard-content">
    <section class="token-section">
      <h2>Auth Token</h2>
      <p class="token-label">Your JWT token:</p>
      <code class="token-display">{{ token }}</code>
    </section>

    <section class="welcome-section">
      <h2>Welcome</h2>
      <p>You have successfully logged in to JobMesh.</p>
      <p>Your token is securely stored in your browser's local storage and will be sent with authenticated API requests.</p>
    </section>
  </main>
</div>
